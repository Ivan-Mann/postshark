<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The best photo submissions are posted here daily">
    <title>Post Shark</title>
    <link rel="icon" type="image/webp" href="sharkFin.webp">
    <style>

        div {
            text-align: center;
        }

        #file::file-selector-button {
        height: 25px;
        border-radius: 0px;
        }

        .grid {
        display: grid;
        align-items: center;
        max-width: 200px;
        margin: auto;
        }

    </style>
</head>

<body style="background-color: rgb(220, 229, 240) ;">

<div>

 <h1>Photo Submission</h1>
 <hr>
 <p>Be sure to input the name of the group that this submission is for.</p>
 <p>If you would like to remain anonymous, just leave the name input empty.</p>
 <hr><br>

<form class="grid" id="uploadForm">
 <label for="name">Your Name:</label>
 <input style="border-color: mediumblue;" type="text" id="name" required>
 <br><br>
 <label for="group">Group:</label>
 <input style="border-color: mediumblue;" type="text" id="group" required>
 <br><br>
 <input type="file" id="file" accept="image/*" required>
 <br>
 <p>Please only click once.<br>It takes a few moments to process.</p>
 <button style="height: 25px; border-radius: 0px;" type="button" onclick="uploadImage()">Submit</button>
 <br>
</form>
 
 <hr>
 <br>
    
 <a style="color:mediumblue;" href="index.html">Back to Landing Page</a>
</div>

<footer>
    <div>
     <p style="text-align: center;"><small>© 2026 Ivan Seliskar. All rights reserved.</small></p>
    </div>
 </footer>

<script>
async function uploadImage() {
    const file = document.getElementById("file").files[0];
    const name = document.getElementById("name").value;
    const group = document.getElementById("group").value;

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "postshark_upload");

    formData.append("context", `uploader=${name}|group=${group}`);

    const response = await fetch(
        "https://api.cloudinary.com/v1_1/deppgzq0b/image/upload",
        {
            method: "POST",
            body: formData
        }
    );

    const data = await response.json();
    
    if (data.secure_url) {
        alert("Successful submission!");
        document.getElementById("uploadForm").reset();

    } else {
        alert("Upload failed. Try again.");
        console.log(data);
    }
}
</script>
</body>
</html>
